{% extends "layout.html" %}
{% block title %}Admin Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header">
                <h3>Edit Your Profile</h3>
            </div>
            <div class="card-body p-4"> {# Added p-4 #}
                <form action="{{ url_for('admin_profile') }}" method="POST">
                    <div class="form-group">
                        <label for="full_name">Full Name</label>
                        <input type="text" id="full_name" name="full_name" value="{{ current_user.full_name }}" required> {# Removed class="form-control" #}
                    </div>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" value="{{ current_user.username }}" required pattern="[a-z0-9_]+" title="Username must be in lowercase and without spaces."> {# Removed class="form-control" #}
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" value="{{ current_user.email or '' }}"> {# Removed class="form-control" #}
                    </div>
                    <hr>
                    <a href="{{ url_for('change_password') }}" class="btn btn-info btn-sm mb-3">Change Password</a>
                    <hr>
                    <button type="submit" class="btn btn-primary">Update Profile</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary btn-sm">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
